name: CI

# Sesharo commits straight to `main` (no PRs for routine work), so run on both push and PR.
# There's no auto-deploy here — a release is a manual `make release` tag — but a green pipeline on
# `main` catches regressions before a HACS release goes out to installed instances.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the Python the pinned pytest-homeassistant-custom-component / HA target.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Ruff lint
        run: ruff check custom_components tests

      - name: Ruff format check
        run: ruff format --check custom_components tests

      - name: Pytest (+ coverage)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Official HA manifest/dependency/translation validator — catches manifest schema errors,
      # bad requirements, and strings/translations drift that `make check` can't.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validate
        uses: hacs/action@main
        with:
          category: integration
          # This integration ships as a HACS *custom repository* (README → Installation), so the
          # default-store *listing* checks don't apply and aren't gated here:
          #   - brands  → icons are submitted to home-assistant/brands separately (see AGENTS.md).
          #   - license → the repo has no LICENSE yet; picking one is a maintainer decision.
          #   - topics  → GitHub repo topics are a discoverability nicety, not a validity check.
          # The integration's *actual* validity (manifest, deps, translations) is enforced by the
          # hassfest job above; this job still runs HACS's structural checks.
          ignore: brands license topics
